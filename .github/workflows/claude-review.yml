name: Claude PR Review

# PR 이 열리거나 갱신될 때 Claude 가 diff 를 리뷰하고 인라인 코멘트를 자동으로 단다.
# 인증: 구독 OAuth 토큰 (claude setup-token → 리포 시크릿 CLAUDE_CODE_OAUTH_TOKEN).
# review-only — 커밋/푸시하지 않고 코멘트만 남긴다.
#
# 이슈 #457: synchronize 마다 PR 전체를 재리뷰하던 것을, detect 스텝이 git 으로 결정론적으로
# full/skip/incremental/integration 4모드로 나눈다(.github/scripts/review_mode.py).
# reviewed state 는 PR 코멘트 마커(<!-- claude-review-state:v1 -->)에 저장한다 — 신규 시크릿·
# 신규 permissions 없이 기존 pull-requests:write 만으로 동작한다.

permissions:
  contents: read
  pull-requests: write
  id-token: write   # claude-code-action OIDC 토큰 교환에 필요

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  review:
    runs-on: ubuntu-latest
    # draft·fork PR 스킵 (fork 는 시크릿 접근 불가).
    # `skip-claude-review` 라벨이 붙은 PR 도 스킵 (#347) — 리뷰가 불필요한 PR(대량 병합 정합,
    # 실험 브랜치 등)을 PR 단위로 끈다. 라벨 부착/제거는 다음 push(synchronize)부터 적용된다.
    # 기본(라벨 없음)은 종전과 동일하게 리뷰 실행.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect review mode
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/review_mode.py detect \
            --workspace "$GITHUB_WORKSPACE" \
            --event-action "${{ github.event.action }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        id: claude
        # skip 모드에서는 Claude 를 실행하지 않는다. job 은 나누지 않고 이 스텝만 조건부로
        # 건너뛴다 — job 이 그대로 success 로 끝나야 머지 파이프라인의 review 체크가
        # pending 으로 남지 않는다(§2.8, 체크 이름 `review` 불변).
        if: steps.detect.outputs.mode != 'skip'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.detect.outputs.prompt }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns ${{ steps.detect.outputs.budget }}

      - name: Save review state
        id: save_state
        # anthropics/claude-code-action@v1 에는 conclusion 출력이 없다 — 성공 판정은
        # review_mode.py save-state 가 execution_file 을 직접 파싱해서 한다(§2.7).
        # workflow cancel 시 이 스텝 자체가 실행되지 않도록 always() 대신 success() 를 쓴다.
        if: success() && steps.detect.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/review_mode.py save-state \
            --meta-file "$GITHUB_WORKSPACE/.claude-review/meta.json" \
            --repo "${{ github.repository }}" \
            --claude-outcome "${{ steps.claude.outcome }}" \
            --execution-file "${{ steps.claude.outputs.execution_file }}"
