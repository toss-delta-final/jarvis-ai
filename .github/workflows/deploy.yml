name: Jarvis AI Server CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/toss-delta-final/jarvis-ai

jobs:
  # 1단계: 이미지 빌드 — EC2 대신 러너에서 빌드 (테스트/린트는 ci.yml이 담당)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시에 필요
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 자동 발급 토큰, 별도 등록 불필요
      # latest + 커밋 해시 태그 (해시 태그는 롤백 시 사용)
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max   # 레이어 캐시로 빌드 가속

  # 2단계: 자동 배포 (CD)
  #   AI 서버는 1대뿐이라 대체할 인스턴스가 없음 — 실패 시 자동 복구가 필수
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read   # EC2에서 GHCR pull 시 필요 (조직 기본 권한에 의존하지 않도록 명시)
    steps:
      - name: AI 서버 배포 및 기동 검증
        uses: appleboy/ssh-action@v1.0.3   # 버전 고정 — @master는 예고 없이 깨짐
        with:
          host: ${{ secrets.EC2_AI_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e   # 명령 하나라도 실패하면 뒤 단계 실행 안 함

            ENV_FILE=/home/ubuntu/jarvis-ai.env
            ENV_PREV=/home/ubuntu/jarvis-ai.env.prev
            LAST_GOOD=/home/ubuntu/jarvis-ai.last-good

            # 1. 롤백 대상 확보 — 교체 전에 현재 실행 중인 이미지를 기억
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' jarvis-ai 2>/dev/null || true)

            # 2. 기존 컨테이너 유지한 채 새 이미지 먼저 받아 대기
            #    여기서 실패하면 아래로 진행하지 않으므로 서비스는 그대로 유지됨
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            # 3. env 파일 백업 후 새 시크릿·변수 기록
            #    pull 성공 후에 수행 — pull 이 실패했을 때 기존 env 를 건드리지 않기 위함
            #    백업 이유: 실패 원인이 잘못된 시크릿 값일 수 있으므로
            #    이미지만 되돌리면 옛 이미지도 깨진 env 를 물려받아 똑같이 죽음
            umask 077
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_PREV"
            fi
            cat << 'ENVEOF' > "$ENV_FILE"
            AUTH_MODE=${{ vars.AUTH_MODE }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER }}
            CATALOG_DB_URL=${{ secrets.CATALOG_DB_URL }}
            PROFILE_DB_URL=${{ secrets.PROFILE_DB_URL }}
            SPRING_BASE_URL=${{ secrets.SPRING_BASE_URL }}
            JWKS_URL=${{ vars.JWKS_URL }}
            JWT_ISSUER=${{ vars.JWT_ISSUER }}
            JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}
            JWT_SCOPE=${{ vars.JWT_SCOPE }}
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_FAST_MODEL_ID=${{ vars.OPENAI_FAST_MODEL_ID }}
            OPENAI_SMART_MODEL_ID=${{ vars.OPENAI_SMART_MODEL_ID }}
            OPENAI_FAST_REASONING_EFFORT=${{ vars.OPENAI_FAST_REASONING_EFFORT }}
            OPENAI_SMART_REASONING_EFFORT=${{ vars.OPENAI_SMART_REASONING_EFFORT }}
            APP_ENVIRONMENT=${{ vars.APP_ENVIRONMENT }}
            # [#258] 코드 기본값은 off(CI/로컬 DB 없는 환경 보호, 2026-08-08 CI hang 회귀).
            # 운영에서 켜려면 두 저장소 변수(Settings → Variables 탭)를 "true" 로 등록한다.
            # 미등록이면 빈 문자열이 들어가지만 기동은 죽지 않는다 —
            # `_empty_color_synonym_gate_settings_use_default`(app/core/config.py, PR #447
            # 리뷰)가 빈 값을 필드 기본값(off)으로 해석해 기능이 꺼진 채 정상 기동한다.
            COLOR_SYNONYM_EXPANSION_ENABLED=${{ vars.COLOR_SYNONYM_EXPANSION_ENABLED }}
            COLOR_SYNONYM_ARRAY_CONTRACT_READY=${{ vars.COLOR_SYNONYM_ARRAY_CONTRACT_READY }}
            # [2026-08-06] 클라이언트 IP 판별 — 도메인 전환 후 실측한 값이다.
            #   브라우저 → Cloudflare → ALB → FastAPI 경로라 XFF 가 2개
            #   (사용자IP, Cloudflare IP)로 도착한다. 오른쪽에서 2번째가 사용자.
            #   백엔드는 nginx 가 한 번 더 붙여 3이다(값이 서로 다른 게 정상).
            #   ALB 는 Cloudflare IP 대역으로만 열려 있어 XFF 위조 경로는 차단됨.
            TRUST_FORWARDED_FOR=${{ vars.TRUST_FORWARDED_FOR }}
            FORWARDED_FOR_TRUSTED_HOPS=${{ vars.FORWARDED_FOR_TRUSTED_HOPS }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
            LANGSMITH_TRACING_SAMPLING_RATE=${{ vars.LANGSMITH_TRACING_SAMPLING_RATE }}
            LANGSMITH_EXPORT_TIMEOUT_S=${{ vars.LANGSMITH_EXPORT_TIMEOUT_S }}
            # [#326] 콘텐츠 추적 모드 — 미설정(빈 값)은 앱이 off 로 해석한다(빈 문자열 내성 validator).
            LANGSMITH_TRACE_CONTENT=${{ vars.LANGSMITH_TRACE_CONTENT }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            PII_HASH_PEPPER=${{ secrets.PII_HASH_PEPPER }}
            EMBEDDING_MODEL_ID=${{ vars.EMBEDDING_MODEL_ID }}
            EMBEDDING_DIM=${{ vars.EMBEDDING_DIM }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            ENVEOF

            # 3b. [#437/#532] 조건부 env 주입 — Variable 미등록이면 그 줄 자체를 아예 생략해
            #     (A) 코드 기본값이 그대로 적용되게 한다. 위 heredoc 처럼 무조건 KEY=${{ vars.X }}
            #     로 쓰면 미등록 시 빈 문자열이 되는데, SPRING_MAX_RETRIES(int)·RESCUE_BUDGET_MODE
            #     (Literal)는 빈 문자열 파싱에 기동이 죽는다(MODEL_PRICE_* 는 이미 NoDecode +
            #     수동 json.loads 로 빈 문자열 내성이 있지만, 네 키를 한 PR 에서 같은 규약으로
            #     통일한다). `${{ vars.X }}` 는 workflow 렌더 시점에 텍스트로 치환되므로 heredoc
            #     안에서는 셸 `if` 를 쓸 수 없어 이 블록을 heredoc 밖에 둔다.
            #     ⚠️ 스크립트 상단에 `set -e` 가 걸려 있다 — `[ -n "$v" ] && printf ...` 는 조건이
            #     거짓일 때 비영 종료라 배포 전체가 중단될 수 있으므로 반드시 `if ... fi` 로 쓴다.
            #     ⚠️ 값에 작은따옴표(')를 쓰지 말 것 — 아래는 렌더된 텍스트를 작은따옴표로 감싸
            #     셸에 넘기므로 값 안의 '가 인용을 깨뜨린다(JSON 단가표·정수·리터럴 enum 값은
            #     해당 없음, quoted heredoc 으로 감싸는 대안은 YAML 블록 스칼라 들여쓰기가 값에
            #     섞여 들어가는 함정이 있어 채택하지 않는다).
            MODEL_PRICE_IN_PER_1K_V='${{ vars.MODEL_PRICE_IN_PER_1K }}'
            if [ -n "$MODEL_PRICE_IN_PER_1K_V" ]; then
              printf 'MODEL_PRICE_IN_PER_1K=%s\n' "$MODEL_PRICE_IN_PER_1K_V" >> "$ENV_FILE"
            fi
            MODEL_PRICE_OUT_PER_1K_V='${{ vars.MODEL_PRICE_OUT_PER_1K }}'
            if [ -n "$MODEL_PRICE_OUT_PER_1K_V" ]; then
              printf 'MODEL_PRICE_OUT_PER_1K=%s\n' "$MODEL_PRICE_OUT_PER_1K_V" >> "$ENV_FILE"
            fi
            SPRING_MAX_RETRIES_V='${{ vars.SPRING_MAX_RETRIES }}'
            if [ -n "$SPRING_MAX_RETRIES_V" ]; then
              printf 'SPRING_MAX_RETRIES=%s\n' "$SPRING_MAX_RETRIES_V" >> "$ENV_FILE"
            fi
            RESCUE_BUDGET_MODE_V='${{ vars.RESCUE_BUDGET_MODE }}'
            if [ -n "$RESCUE_BUDGET_MODE_V" ]; then
              printf 'RESCUE_BUDGET_MODE=%s\n' "$RESCUE_BUDGET_MODE_V" >> "$ENV_FILE"
            fi

            # 4. 교체 — 8000 포트를 새 컨테이너가 이어받아야 하므로 중지 후 기동
            #    docker run 뒤의 || true 는 필수: 기동 명령 자체가 실패해도
            #    스크립트를 중단시키지 않고 아래 롤백 경로로 흘려보내기 위함
            docker stop jarvis-ai || true
            docker rm -f jarvis-ai || true
            docker run -d \
              --name jarvis-ai \
              --restart always \
              -p 8000:8000 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$ENV_FILE" \
              ${{ env.IMAGE }}:${{ github.sha }} || true

            # 5. 기동 확인 — 2초 간격 최대 45회(약 90초)
            #    모델 로딩·DB 초기화가 느려질 수 있어 기존 60초에서 상향
            OK=0
            for i in $(seq 1 45); do
              if curl -fs http://localhost:8000/health > /dev/null; then OK=1; break; fi
              sleep 2
            done

            # 6. 실패 시 롤백 — AI 서버는 대체 인스턴스가 없으므로 반드시 되살려야 함
            if [ "$OK" != "1" ]; then
              docker logs --tail 100 jarvis-ai || true
              docker rm -f jarvis-ai || true

              ROLLBACK_IMAGE="$PREV_IMAGE"
              if [ -z "$ROLLBACK_IMAGE" ] && [ -f "$LAST_GOOD" ]; then
                ROLLBACK_IMAGE=$(cat "$LAST_GOOD")
              fi

              # 되돌릴 대상이 아예 없는 경우 — 수동 개입 필요
              if [ -z "$ROLLBACK_IMAGE" ]; then
                docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.CreatedSince}}' | head -10
                exit 1
              fi

              # env 파일도 함께 원복
              if [ -f "$ENV_PREV" ]; then
                cp "$ENV_PREV" "$ENV_FILE"
              fi

              docker run -d \
                --name jarvis-ai \
                --restart always \
                -p 8000:8000 \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --env-file "$ENV_FILE" \
                "$ROLLBACK_IMAGE" || true

              # 롤백이 실제로 살아났는지 검증 — 최대 60초
              RB=0
              for i in $(seq 1 30); do
                if curl -fs http://localhost:8000/health > /dev/null; then RB=1; break; fi
                sleep 2
              done

              # 롤백까지 실패한 경우에만 두 번째 로그 블록이 찍힘 — 즉시 수동 개입 신호
              if [ "$RB" != "1" ]; then
                docker ps -a --filter 'name=jarvis-ai' --format '{{.Names}} {{.Status}}'
                docker logs --tail 50 jarvis-ai || true
              fi
              exit 1
            fi

            # 7. 정상 기동 확인됨 — 이 이미지를 '마지막 정상'으로 기록
            docker inspect -f '{{.Config.Image}}' jarvis-ai > "$LAST_GOOD"

            # 8. 48시간 이상 지난 미사용 이미지 정리 (sha 태그 누적 방지)
            docker image prune -af --filter "until=48h"
